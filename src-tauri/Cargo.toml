[package]
name = "axion"
version = "0.5.0"
description = "Axion: an offline circuit and microcontroller simulator"
authors = ["The Axion Authors"]
license = "Apache-2.0"
repository = "https://github.com/cobrapy-x/Axion"
edition = "2021"
rust-version = "1.77"

[lib]
name = "axion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri-plugin-localhost = "2"
portpicker = "0.1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
